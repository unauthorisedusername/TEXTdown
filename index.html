<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>CODEdown</title>
<style>
:root{--bg:#1e1e2e;--panel:#181825;--fg:#cdd6f4;--mut:#7f849c;--acc:#89b4fa;--fs:14px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--panel);align-items:center;flex:none}
.i{width:22px;height:22px;flex:none}
button.soon{opacity:.35}
button.soon:active{background:#313244;color:var(--fg)}
.nav{display:flex;gap:4px}
.nav button{padding:8px 11px}
button{display:inline-flex;align-items:center;gap:6px;background:#313244;color:var(--fg);border:0;border-radius:8px;padding:8px 12px;font-size:14px;white-space:nowrap}
button:active{background:var(--acc);color:#11111b}
#name{color:var(--fg);font-weight:600}
#wrap{flex:1;display:flex;min-height:0}
#gutter,#ed{font:var(--fs)/1.5 ui-monospace,Menlo,Consolas,monospace}
#gutter{width:52px;overflow:hidden;background:var(--panel);color:var(--mut);text-align:right;padding:8px 6px;white-space:pre;user-select:none;flex:none}
#ed{flex:1;border:0;outline:0;resize:none;background:var(--bg);color:var(--fg);padding:8px;white-space:pre;overflow:auto;tab-size:2}
#status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;flex:none;padding:4px 10px;font-size:12px;color:var(--mut);background:var(--panel)}
#status .cred{opacity:.7;margin-left:auto}
#status .zoom{display:flex;gap:4px}
#status .zoom button{padding:2px 10px;font-size:13px}
#preview{display:none;position:fixed;inset:0;background:#fff;flex-direction:column;z-index:5}
#preview.on{display:flex}
#preview .top{padding:6px;background:var(--panel)}
#preview iframe{flex:1;border:0;background:#fff}
#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
#dlg .box{background:var(--panel);border-radius:14px;padding:18px;width:100%;max-width:420px}
#dlg h3{margin:0 0 10px;font-size:16px}
#dlg input{width:100%;padding:10px;font-size:16px;border-radius:8px;border:1px solid #45475a;background:var(--bg);color:var(--fg)}
#dlg label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
#dlg .f{display:flex;gap:6px;align-items:center}
#dlg .f input{flex:1;min-width:0}
#dlg .f button{padding:10px 14px;font-size:16px}
#dlg .f .i{width:20px;height:20px}
#dlg .dot{font-size:20px;color:var(--mut)}
#dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:#313244;color:var(--fg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9}
</style>
</head>

<div id="app">
  <div id="bar">
    <button title="Clear all content" aria-label="Clear all content" onclick="clearAll()"><svg class="i"><use href="#i-trash"/></svg></button>
    <button id="saveBtn" title="Save (hold for Save As)" aria-label="Save (hold for Save As)"><svg class="i"><use href="#i-save"/></svg></button>
    <button title="Restore original" aria-label="Restore original" onclick="restore()"><svg class="i"><use href="#i-restore"/></svg></button>
    <button title="New file" aria-label="New file" onclick="newFile()"><svg class="i"><use href="#i-plus"/></svg></button>
    <span class="nav"><button title="Cursor left" aria-label="Cursor left" onpointerdown="event.preventDefault()" onclick="nav('L')"><svg class="i"><use href="#i-left"/></svg></button><button title="Cursor up" aria-label="Cursor up" onpointerdown="event.preventDefault()" onclick="nav('U')"><svg class="i"><use href="#i-up"/></svg></button><button title="Cursor down" aria-label="Cursor down" onpointerdown="event.preventDefault()" onclick="nav('D')"><svg class="i"><use href="#i-down"/></svg></button><button title="Cursor right" aria-label="Cursor right" onpointerdown="event.preventDefault()" onclick="nav('R')"><svg class="i"><use href="#i-right"/></svg></button></span>
    <button title="Copy selection (or all)" aria-label="Copy selection (or all)" onpointerdown="event.preventDefault()" onclick="copyText()"><svg class="i"><use href="#i-copycheck"/></svg></button>
    <button title="Paste" aria-label="Paste" onpointerdown="event.preventDefault()" onclick="pasteText()"><svg class="i"><use href="#i-paste"/></svg></button>
    <button title="Open file" aria-label="Open file" onclick="openFile()"><svg class="i"><use href="#i-folder"/></svg></button>
    <button title="Run preview" aria-label="Run preview" onclick="runPreview()"><svg class="i"><use href="#i-run"/></svg></button>
    <button class="soon" title="Settings (coming soon)" aria-label="Settings (coming soon)" onclick="toast('Settings: coming soon')"><svg class="i"><use href="#i-settings"/></svg></button>
    <button title="Select all" aria-label="Select all" onclick="selectAll()"><svg class="i"><use href="#i-add-text"/></svg></button>
    <button title="Undo" aria-label="Undo" onpointerdown="event.preventDefault()" onclick="undo()"><svg class="i"><use href="#i-undo"/></svg></button>
    <button title="Redo" aria-label="Redo" onpointerdown="event.preventDefault()" onclick="redo()"><svg class="i"><use href="#i-redo"/></svg></button>
  </div>
  <div id="wrap"><div id="gutter"></div><textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div>
  <div id="status"><span id="name"></span><span id="pos">Ln 1, Col 1</span><span class="zoom"><button title="Smaller text" onclick="zoom(-1)">A−</button><button title="Bigger text" onclick="zoom(1)">A+</button></span><span class="cred">Icons: Solar by 480 Design (CC BY 4.0) · Fluent UI (MIT) · Lucide (ISC)</span></div>
</div>
<div id="preview"><div class="top"><button onclick="closePreview()">✕ Close</button></div><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
<div id="dlg"><div class="box"><h3>Save as</h3>
  <label>File name</label>
  <div class="f"><input id="dname" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button onpointerdown="event.preventDefault()" onclick="mv('dname',-1)"><svg class="i"><use href="#i-left"/></svg></button>
    <button onpointerdown="event.preventDefault()" onclick="mv('dname',1)"><svg class="i"><use href="#i-right"/></svg></button></div>
  <label>Extension</label>
  <div class="f"><span class="dot">.</span><input id="dext" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="html">
    <button onpointerdown="event.preventDefault()" onclick="mv('dext',-1)"><svg class="i"><use href="#i-left"/></svg></button>
    <button onpointerdown="event.preventDefault()" onclick="mv('dext',1)"><svg class="i"><use href="#i-right"/></svg></button></div>
  <div class="row"><button onclick="dlgCancel()">Cancel</button><button onclick="dlgOk()">Save</button></div>
</div></div>
<div id="toast"></div>
<input type="file" id="picker" style="display:none">

<script>
const $ = id => document.getElementById(id);
const ed = $('ed'), gut = $('gutter');
let fileName = 'untitled.html', dirty = false, fs = 14, original = '';

function setName(){ $('name').textContent = fileName + (dirty ? ' •' : ''); }
function lines(){
  const n = ed.value.split('\n').length; let s = '';
  for (let i = 1; i <= n; i++) s += i + '\n';
  gut.textContent = s; gut.scrollTop = ed.scrollTop;
}
function pos(){
  const b = ed.value.slice(0, ed.selectionStart).split('\n');
  $('pos').textContent = 'Ln ' + b.length + ', Col ' + (b[b.length-1].length + 1);
}
function toast(m){
  const t = $('toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2200);
}
function load(name, text){
  fileName = name; ed.value = text; original = text; dirty = false;
  setName(); lines(); pos(); ed.scrollTop = 0;
}

ed.addEventListener('input', () => { dirty = true; setName(); lines(); pos(); });
ed.addEventListener('scroll', () => { gut.scrollTop = ed.scrollTop; });
['keyup','click','focus'].forEach(e => ed.addEventListener(e, pos));
ed.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    ed.setRangeText('  ', ed.selectionStart, ed.selectionEnd, 'end');
    ed.dispatchEvent(new Event('input'));
  } else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
});

function zoom(d){
  fs = Math.min(28, Math.max(10, fs + d));
  document.documentElement.style.setProperty('--fs', fs + 'px');
}
function newFile(){
  if (dirty && !confirm('Discard unsaved changes?')) return;
  load('untitled.html', '');
}
function openFile(){
  if (dirty && !confirm('Discard unsaved changes?')) return;
  if (window.Android) Android.pickFile(); else $('picker').click();
}
$('picker').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => load(f.name, r.result);
  r.readAsText(f); e.target.value = '';
});

function save(){
  if (window.Android) {
    const r = Android.saveFile(ed.value);
    if (r === 'OK') { dirty = false; setName(); toast('Saved'); }
    else {
      if (r !== 'NOURI') toast('Cannot write to original file — save a copy');
      saveAs();
    }
  } else saveAs();
}
function saveAs(){
  askName(fileName, name => {
    if (window.Android) Android.saveAs(name, ed.value);
    else download(name);
  });
}
function download(name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ed.value], {type: 'text/plain'}));
  a.download = name; a.click(); fileName = name; dirty = false; setName();
}

/* ---- Name dialog ---- */
let dlgCb = null;
function mv(id, d){
  const el = $(id); el.focus();
  const p = Math.max(0, Math.min(el.value.length, (el.selectionStart || 0) + d));
  el.setSelectionRange(p, p);
}
function askName(def, cb){
  dlgCb = cb;
  const d = def.lastIndexOf('.');
  $('dname').value = d > 0 ? def.slice(0, d) : def;
  $('dext').value = d > 0 ? def.slice(d + 1) : '';
  $('dlg').classList.add('on');
  setTimeout(() => { const i = $('dname'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 50);
}
function dlgCancel(){ $('dlg').classList.remove('on'); dlgCb = null; }
function dlgOk(){
  const clean = v => v.trim().replace(/[\\/:*?"<>|]/g, '_');
  const base = clean($('dname').value);
  const ext = clean($('dext').value).replace(/^\.+/, '');
  if (!base) { toast('Enter a file name'); return; }
  const n = ext ? base + '.' + ext : base;
  const cb = dlgCb; dlgCancel(); if (cb) cb(n);
}
['dname','dext'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') dlgOk(); }));

/* ---- Restore original copy ---- */
function restore(){
  if (ed.value === original) { toast('Already the original'); return; }
  if (!confirm('Restore the original copy? Your current edits will be replaced.')) return;
  ed.focus(); ed.select();
  let ok = false;
  try { ok = document.execCommand('insertText', false, original); } catch (e) {}
  if (ed.value !== original) ed.value = original;
  ed.scrollTop = 0; ed.setSelectionRange(0, 0);
  dirty = true; setName(); lines(); pos();
  toast('Original restored — tap Save to write it back');
}

/* ---- Cursor arrows ---- */
function nav(d){
  ed.focus();
  const t = ed.value, len = t.length;
  let p = ed.selectionStart;
  const ls = t.lastIndexOf('\n', p - 1) + 1, col = p - ls;
  if (d === 'L') p = Math.max(0, p - 1);
  else if (d === 'R') p = Math.min(len, p + 1);
  else if (d === 'U') {
    if (ls === 0) p = 0;
    else { const ps = t.lastIndexOf('\n', ls - 2) + 1; p = ps + Math.min(col, ls - 1 - ps); }
  } else if (d === 'D') {
    const nl = t.indexOf('\n', p);
    if (nl === -1) p = len;
    else { const ns = nl + 1; let ne = t.indexOf('\n', ns); if (ne === -1) ne = len; p = ns + Math.min(col, ne - ns); }
  }
  ed.setSelectionRange(p, p);
  const lh = fs * 1.5, y = t.slice(0, p).split('\n').length - 1;
  const top = 8 + y * lh;
  if (top < ed.scrollTop) ed.scrollTop = top;
  else if (top + lh + 8 > ed.scrollTop + ed.clientHeight) ed.scrollTop = top + lh + 8 - ed.clientHeight;
  gut.scrollTop = ed.scrollTop; pos();
}

/* ---- Select all / copy ---- */
function selectAll(){ ed.focus(); ed.select(); pos(); }
function copyText(){
  ed.focus();
  let a = ed.selectionStart, b = ed.selectionEnd, all = false;
  if (a === b) { a = 0; b = ed.value.length; all = true; ed.setSelectionRange(a, b); }
  const text = ed.value.substring(a, b);
  if (!text) { toast('Nothing to copy'); return; }
  let ok = false;
  if (window.Android && Android.setClipboard) { Android.setClipboard(text); ok = true; }
  else { try { ok = document.execCommand('copy'); } catch (e) {} }
  toast(ok ? (all ? 'Copied all' : 'Copied selection') : 'Copy failed');
}
function insertAtCursor(t){
  if (!t) { toast('Clipboard is empty'); return; }
  ed.focus();
  let ok = false;
  try { ok = document.execCommand('insertText', false, t); } catch (e) {}
  if (!ok) { ed.setRangeText(t, ed.selectionStart, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input')); }
}
function pasteText(){
  ed.focus();
  if (window.Android && Android.getClipboard) { insertAtCursor(Android.getClipboard()); }
  else if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText().then(insertAtCursor, () => toast('Paste blocked'));
  } else toast('Paste not available');
}
function clearAll(){
  if (!ed.value) { toast('Already empty'); return; }
  if (!confirm('Clear all content?')) return;
  ed.focus(); ed.select();
  try { document.execCommand('delete'); } catch (e) {}
  if (ed.value !== '') ed.value = '';
  dirty = true; setName(); lines(); pos(); toast('Cleared (Undo brings it back)');
}
function afterHistory(){ dirty = true; setName(); lines(); pos(); }
function undo(){ ed.focus(); if (document.execCommand('undo')) afterHistory(); else toast('Nothing to undo'); }
function redo(){ ed.focus(); if (document.execCommand('redo')) afterHistory(); else toast('Nothing to redo'); }

/* Save button: tap = Save, hold = Save As */
(function(){
  const sb = $('saveBtn'); let t = null, held = false;
  sb.addEventListener('pointerdown', () => { held = false; t = setTimeout(() => { held = true; saveAs(); }, 600); });
  ['pointerup','pointerleave','pointercancel'].forEach(e => sb.addEventListener(e, () => clearTimeout(t)));
  sb.addEventListener('click', () => { if (held) { held = false; return; } save(); });
  sb.addEventListener('contextmenu', e => e.preventDefault());
})();

function runPreview(){ $('frame').srcdoc = ed.value; $('preview').classList.add('on'); }
function closePreview(){ $('preview').classList.remove('on'); $('frame').srcdoc = ''; }

/* ---- Called by the Android app ---- */
window.openFileInEditor = (name, text) => load(name, text);
window.onSaveResult = (ok, name, msg) => {
  if (ok) { if (name) fileName = name; dirty = false; setName(); toast('Saved'); }
  else toast(msg || 'Save failed');
};

load(fileName, '<!DOCTYPE html>\n<html>\n<head>\n  <title>Hello</title>\n</head>\n<body>\n  <h1>Hello, world!</h1>\n</body>\n</html>\n');
dirty = false; setName();
</script>
</body>
</html>
