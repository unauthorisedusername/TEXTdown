<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CODEdown</title>
<style>
:root{
  --bg:#15151d;--panel:#1a1a24;--raised:#232330;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --fg:#d6daf0;--mut:#7c8099;--acc:#8ca9ff;--acc-soft:rgba(140,169,255,.14);
  --warn:#f0b27a;--danger:#f38ba8;--fs:14px;--pad:12px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%}
.i{width:20px;height:20px;flex:none}

/* ---- Toolbar ---- */
#bar{display:flex;align-items:center;gap:2px;flex:none;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.grp{display:flex;gap:2px;flex:none}
.sep{width:1px;height:20px;background:var(--line2);margin:0 8px;flex:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:11px;color:var(--mut);transition:background .15s,color .15s,transform .1s}
@media (hover:hover){.ib:hover{background:rgba(255,255,255,.05);color:var(--fg)}}
.ib:active{background:var(--acc-soft);color:var(--acc);transform:scale(.92)}
.ib.acc{color:var(--acc)}
.ib.run{color:var(--acc);background:var(--acc-soft)}
.ib.run:active{background:var(--acc);color:#10101a}
.ib.soon{opacity:.4}
#saveBtn{position:relative}
#saveBtn.dirty::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--panel)}

/* ---- Editor ---- */
#wrap{flex:1;display:flex;min-height:0}
#gutter,#ed{font:var(--fs)/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#gutter{width:48px;flex:none;overflow:hidden;background:var(--bg);color:var(--mut);opacity:.7;text-align:right;padding:var(--pad) 10px 40px 0;white-space:pre;user-select:none;border-right:1px solid var(--line)}
#ed{flex:1;min-width:0;border:0;outline:0;resize:none;background:var(--bg);color:var(--fg);caret-color:var(--acc);padding:var(--pad) 14px 40px;white-space:pre;overflow:auto;tab-size:2}
#ed::selection{background:rgba(140,169,255,.32)}

/* ---- Status ---- */
#status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;flex:none;padding:6px 12px;padding-bottom:max(6px,env(safe-area-inset-bottom));font-size:11.5px;color:var(--mut);background:var(--panel);border-top:1px solid var(--line)}
#name{color:var(--fg);font-weight:500;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#name.dirty::after{content:" •";color:var(--warn)}
#pos{font-variant-numeric:tabular-nums}
#status .zoom{display:flex;gap:2px;margin-left:auto}
#status .zoom button{padding:3px 10px;border-radius:8px;font-size:12.5px;color:var(--mut)}
#status .zoom button:active{background:var(--acc-soft);color:var(--acc)}

/* ---- Buttons (text) ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;background:var(--raised);color:var(--fg);font-size:14px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97);background:#2d2d3d}
.btn.pri{background:var(--acc);color:#10101a;font-weight:600}
.btn.pri:active{background:#a9bdff}
.btn.dng{background:var(--danger);color:#1a0f13;font-weight:600}

/* ---- Preview ---- */
#preview{display:none;position:fixed;inset:0;background:#fff;flex-direction:column;z-index:5}
#preview.on{display:flex}
#preview .top{display:flex;align-items:center;gap:10px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
#preview .top span{color:var(--mut);font-size:13px}
#preview iframe{flex:1;border:0;background:#fff}

/* ---- Dialogs ---- */
.dlg{display:none;position:fixed;inset:0;background:rgba(8,8,14,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:20;align-items:center;justify-content:center;padding:16px}
.dlg.on{display:flex}
.dlg .box{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.dlg h3{margin:0 0 6px;font-size:16px;font-weight:600}
.dlg p{margin:0;font-size:14px;line-height:1.5;color:var(--mut)}
.dlg input{width:100%;padding:11px 12px;font-size:16px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);outline:0;transition:border-color .15s,box-shadow .15s}
.dlg input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.dlg label{display:block;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.dlg .f{display:flex;gap:6px;align-items:center}
.dlg .f input{flex:1;min-width:0}
.dlg .dot{font-size:20px;color:var(--mut)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* ---- Toast ---- */
#toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--raised);border:1px solid var(--line2);color:var(--fg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<div id="app">
  <div id="bar">
    <div class="grp">
      <button class="ib" title="New file" aria-label="New file" onclick="newFile()"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="ib" title="Open file" aria-label="Open file" onclick="openFile()"><svg class="i"><use href="#i-folder"/></svg></button>
      <button class="ib acc" id="saveBtn" title="Save (hold for Save As)" aria-label="Save (hold for Save As)"><svg class="i"><use href="#i-save"/></svg></button>
      <button class="ib" title="Restore original" aria-label="Restore original" onclick="restore()"><svg class="i"><use href="#i-restore"/></svg></button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="ib" title="Undo" aria-label="Undo" onpointerdown="event.preventDefault()" onclick="undo()"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="ib" title="Redo" aria-label="Redo" onpointerdown="event.preventDefault()" onclick="redo()"><svg class="i"><use href="#i-redo"/></svg></button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="ib" title="Copy selection (or all)" aria-label="Copy selection (or all)" onpointerdown="event.preventDefault()" onclick="copyText()"><svg class="i"><use href="#i-copycheck"/></svg></button>
      <button class="ib" title="Paste" aria-label="Paste" onpointerdown="event.preventDefault()" onclick="pasteText()"><svg class="i"><use href="#i-paste"/></svg></button>
      <button class="ib" title="Select all" aria-label="Select all" onclick="selectAll()"><svg class="i"><use href="#i-add-text"/></svg></button>
      <button class="ib" title="Clear all content" aria-label="Clear all content" onclick="clearAll()"><svg class="i"><use href="#i-trash"/></svg></button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="ib" title="Cursor left" aria-label="Cursor left" onpointerdown="event.preventDefault()" onclick="nav('L')"><svg class="i"><use href="#i-left"/></svg></button>
      <button class="ib" title="Cursor up" aria-label="Cursor up" onpointerdown="event.preventDefault()" onclick="nav('U')"><svg class="i"><use href="#i-up"/></svg></button>
      <button class="ib" title="Cursor down" aria-label="Cursor down" onpointerdown="event.preventDefault()" onclick="nav('D')"><svg class="i"><use href="#i-down"/></svg></button>
      <button class="ib" title="Cursor right" aria-label="Cursor right" onpointerdown="event.preventDefault()" onclick="nav('R')"><svg class="i"><use href="#i-right"/></svg></button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="ib run" title="Run preview" aria-label="Run preview" onclick="runPreview()"><svg class="i"><use href="#i-run"/></svg></button>
      <button class="ib" title="Settings" aria-label="Settings" onclick="openSettings()"><svg class="i"><use href="#i-settings"/></svg></button>
    </div>
  </div>
  <div id="wrap"><div id="gutter"></div><textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div>
  <div id="status"><span id="name"></span><span id="pos">Ln 1, Col 1</span><span class="zoom"><button title="Smaller text" onclick="zoom(-1)">A−</button><button title="Bigger text" onclick="zoom(1)">A+</button></span></div>
</div>
<div id="preview"><div class="top"><button class="btn" onclick="closePreview()">✕ Close</button><span>Preview</span></div><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>

<div class="dlg" id="dlg"><div class="box"><h3>Save as</h3>
  <label>File name</label>
  <div class="f"><input id="dname" autocapitalize="off" autocomplete="off" spellcheck="false">
    <button class="ib" onpointerdown="event.preventDefault()" onclick="mv('dname',-1)"><svg class="i"><use href="#i-left"/></svg></button>
    <button class="ib" onpointerdown="event.preventDefault()" onclick="mv('dname',1)"><svg class="i"><use href="#i-right"/></svg></button></div>
  <label>Extension</label>
  <div class="f"><span class="dot">.</span><input id="dext" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="html">
    <button class="ib" onpointerdown="event.preventDefault()" onclick="mv('dext',-1)"><svg class="i"><use href="#i-left"/></svg></button>
    <button class="ib" onpointerdown="event.preventDefault()" onclick="mv('dext',1)"><svg class="i"><use href="#i-right"/></svg></button></div>
  <div class="row"><button class="btn" onclick="dlgCancel()">Cancel</button><button class="btn pri" onclick="dlgOk()">Save</button></div>
</div></div>

<div class="dlg" id="cfm"><div class="box"><h3 id="ct"></h3><p id="cm"></p>
  <div class="row"><button class="btn" onclick="cfmClose(false)">Cancel</button><button class="btn dng" id="cok" onclick="cfmClose(true)">OK</button></div>
</div></div>

<div class="dlg" id="set"><div class="box"><h3>Settings</h3>
  <label>About</label>
  <p><b style="color:var(--fg)">CODEdown</b><br>A minimal code editor and HTML previewer.</p>
  <label>Icon credits</label>
  <p>Solar by 480 Design (CC BY 4.0)<br>Fluent UI System Icons by Microsoft (MIT)<br>Lucide (ISC)</p>
  <div class="row"><button class="btn pri" onclick="closeSettings()">Done</button></div>
</div></div>

<div id="toast"></div>
<input type="file" id="picker" style="display:none">

<script>
const $ = id => document.getElementById(id);
const ed = $('ed'), gut = $('gutter');
const PAD = 12;
let fileName = 'untitled.html', dirty = false, fs = 14, original = '';

function setName(){
  $('name').textContent = fileName;
  $('name').classList.toggle('dirty', dirty);
  $('saveBtn').classList.toggle('dirty', dirty);
}
function lines(){
  const n = ed.value.split('\n').length; let s = '';
  for (let i = 1; i <= n; i++) s += i + '\n';
  gut.textContent = s; gut.scrollTop = ed.scrollTop;
}
function pos(){
  const b = ed.value.slice(0, ed.selectionStart).split('\n');
  $('pos').textContent = 'Ln ' + b.length + ', Col ' + (b[b.length-1].length + 1);
}
function toast(m){
  const t = $('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}
function load(name, text){
  fileName = name; ed.value = text; original = text; dirty = false;
  setName(); lines(); pos(); ed.scrollTop = 0;
}

/* ---- In-app confirm (window.confirm is unreliable in WebViews) ---- */
let cfmCb = null;
function ask(title, msg, okLabel, cb){
  $('ct').textContent = title; $('cm').textContent = msg; $('cok').textContent = okLabel;
  cfmCb = cb; $('cfm').classList.add('on');
}
function cfmClose(ok){
  $('cfm').classList.remove('on');
  const cb = cfmCb; cfmCb = null;
  if (ok && cb) cb();
}

ed.addEventListener('input', () => { dirty = true; setName(); lines(); pos(); });
ed.addEventListener('scroll', () => { gut.scrollTop = ed.scrollTop; });
['keyup','click','focus','select'].forEach(e => ed.addEventListener(e, pos));
ed.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    ed.setRangeText('  ', ed.selectionStart, ed.selectionEnd, 'end');
    ed.dispatchEvent(new Event('input'));
  } else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('cfm').classList.contains('on')) cfmClose(false);
  else if ($('set').classList.contains('on')) closeSettings();
  else if ($('dlg').classList.contains('on')) dlgCancel();
  else if ($('preview').classList.contains('on')) closePreview();
});

function zoom(d){
  fs = Math.min(28, Math.max(10, fs + d));
  document.documentElement.style.setProperty('--fs', fs + 'px');
}
function newFile(){
  const go = () => load('untitled.html', '');
  if (dirty) ask('Discard changes?', 'Your unsaved changes will be lost.', 'Discard', go); else go();
}
function openFile(){
  const go = () => { if (window.Android) Android.pickFile(); else $('picker').click(); };
  if (dirty) ask('Discard changes?', 'Your unsaved changes will be lost.', 'Discard', go); else go();
}
$('picker').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => load(f.name, r.result);
  r.readAsText(f); e.target.value = '';
});

function save(){
  if (window.Android) {
    const r = Android.saveFile(ed.value);
    if (r === 'OK') { dirty = false; setName(); toast('Saved'); }
    else {
      if (r !== 'NOURI') toast('Cannot write to original file — save a copy');
      saveAs();
    }
  } else saveAs();
}
function saveAs(){
  askName(fileName, name => {
    if (window.Android) Android.saveAs(name, ed.value);
    else download(name);
  });
}
function download(name){
  const url = URL.createObjectURL(new Blob([ed.value], {type: 'text/plain'}));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  fileName = name; dirty = false; setName();
}

/* ---- Name dialog ---- */
let dlgCb = null;
function mv(id, d){
  const el = $(id); el.focus();
  const p = Math.max(0, Math.min(el.value.length, (el.selectionStart || 0) + d));
  el.setSelectionRange(p, p);
}
function askName(def, cb){
  dlgCb = cb;
  const d = def.lastIndexOf('.');
  $('dname').value = d > 0 ? def.slice(0, d) : def;
  $('dext').value = d > 0 ? def.slice(d + 1) : '';
  $('dlg').classList.add('on');
  setTimeout(() => { const i = $('dname'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 50);
}
function dlgCancel(){ $('dlg').classList.remove('on'); dlgCb = null; }
function dlgOk(){
  const clean = v => v.trim().replace(/[\\/:*?"<>|]/g, '_');
  const base = clean($('dname').value);
  const ext = clean($('dext').value).replace(/^\.+/, '');
  if (!base) { toast('Enter a file name'); return; }
  const n = ext ? base + '.' + ext : base;
  const cb = dlgCb; dlgCancel(); if (cb) cb(n);
}
['dname','dext'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') dlgOk(); }));

/* ---- Restore original copy ---- */
function restore(){
  if (ed.value === original) { toast('Already the original'); return; }
  ask('Restore original?', 'Your current edits will be replaced. Undo can bring them back.', 'Restore', () => {
    ed.focus(); ed.select();
    try { document.execCommand('insertText', false, original); } catch (e) {}
    if (ed.value !== original) ed.value = original;
    ed.scrollTop = 0; ed.setSelectionRange(0, 0);
    dirty = true; setName(); lines(); pos();
    toast('Original restored — tap Save to write it back');
  });
}

/* ---- Cursor arrows ---- */
function nav(d){
  ed.focus();
  const t = ed.value, len = t.length;
  let p = ed.selectionStart;
  const ls = t.lastIndexOf('\n', p - 1) + 1, col = p - ls;
  if (d === 'L') p = Math.max(0, p - 1);
  else if (d === 'R') p = Math.min(len, p + 1);
  else if (d === 'U') {
    if (ls === 0) p = 0;
    else { const ps = t.lastIndexOf('\n', ls - 2) + 1; p = ps + Math.min(col, ls - 1 - ps); }
  } else if (d === 'D') {
    const nl = t.indexOf('\n', p);
    if (nl === -1) p = len;
    else { const ns = nl + 1; let ne = t.indexOf('\n', ns); if (ne === -1) ne = len; p = ns + Math.min(col, ne - ns); }
  }
  ed.setSelectionRange(p, p);
  const lh = fs * 1.5, y = t.slice(0, p).split('\n').length - 1;
  const top = PAD + y * lh;
  if (top < ed.scrollTop) ed.scrollTop = top - PAD;
  else if (top + lh + PAD > ed.scrollTop + ed.clientHeight) ed.scrollTop = top + lh + PAD - ed.clientHeight;
  gut.scrollTop = ed.scrollTop; pos();
}

/* ---- Select all / copy / paste / clear ---- */
function selectAll(){ ed.focus(); ed.select(); pos(); }
function copyText(){
  ed.focus();
  let a = ed.selectionStart, b = ed.selectionEnd, all = false;
  if (a === b) { a = 0; b = ed.value.length; all = true; ed.setSelectionRange(a, b); }
  const text = ed.value.substring(a, b);
  if (!text) { toast('Nothing to copy'); return; }
  let ok = false;
  if (window.Android && Android.setClipboard) { Android.setClipboard(text); ok = true; }
  else { try { ok = document.execCommand('copy'); } catch (e) {} }
  toast(ok ? (all ? 'Copied all' : 'Copied selection') : 'Copy failed');
}
function insertAtCursor(t){
  if (!t) { toast('Clipboard is empty'); return; }
  ed.focus();
  let ok = false;
  try { ok = document.execCommand('insertText', false, t); } catch (e) {}
  if (!ok) { ed.setRangeText(t, ed.selectionStart, ed.selectionEnd, 'end'); ed.dispatchEvent(new Event('input')); }
}
function pasteText(){
  ed.focus();
  if (window.Android && Android.getClipboard) { insertAtCursor(Android.getClipboard()); }
  else if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText().then(insertAtCursor, () => toast('Paste blocked'));
  } else toast('Paste not available');
}
function clearAll(){
  if (!ed.value) { toast('Already empty'); return; }
  ask('Clear all content?', 'Undo can bring it back.', 'Clear', () => {
    ed.focus(); ed.select();
    try { document.execCommand('delete'); } catch (e) {}
    if (ed.value !== '') ed.value = '';
    dirty = true; setName(); lines(); pos(); toast('Cleared');
  });
}
function afterHistory(){ dirty = true; setName(); lines(); pos(); }
function undo(){ ed.focus(); if (document.execCommand('undo')) afterHistory(); else toast('Nothing to undo'); }
function redo(){ ed.focus(); if (document.execCommand('redo')) afterHistory(); else toast('Nothing to redo'); }

/* Save button: tap = Save, hold = Save As */
(function(){
  const sb = $('saveBtn'); let t = null, held = false;
  sb.addEventListener('pointerdown', () => { held = false; t = setTimeout(() => { held = true; saveAs(); }, 600); });
  ['pointerup','pointerleave','pointercancel'].forEach(e => sb.addEventListener(e, () => clearTimeout(t)));
  sb.addEventListener('click', () => { if (held) { held = false; return; } save(); });
  sb.addEventListener('contextmenu', e => e.preventDefault());
})();

function openSettings(){ $('set').classList.add('on'); }
function closeSettings(){ $('set').classList.remove('on'); }
function runPreview(){ $('frame').srcdoc = ed.value; $('preview').classList.add('on'); }
function closePreview(){ $('preview').classList.remove('on'); $('frame').srcdoc = ''; }

/* ---- Called by the Android app ---- */
window.openFileInEditor = (name, text) => load(name, text);
window.onSaveResult = (ok, name, msg) => {
  if (ok) { if (name) fileName = name; dirty = false; setName(); toast('Saved'); }
  else toast(msg || 'Save failed');
};

load(fileName, '<!DOCTYPE html>\n<html>\n<head>\n  <title>Hello</title>\n</head>\n<body>\n  <h1>Hello, world!</h1>\n</body>\n</html>\n');
dirty = false; setName();
</script>
</body>
</html>
